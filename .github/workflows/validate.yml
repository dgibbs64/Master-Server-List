name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint scripts
        run: shellcheck scripts/*.sh

      - name: Validate servers.json
        run: jq -e '.games | type == "array" and all(.[]; (.name | type == "string") and all(.masters[]; (.host | type == "string") and (.probe.type | IN("tcp", "gamespy", "getservers", "q2query", "qwquery", "idtech4", "zandronum", "odamex", "chocolatedoom", "cube2", "http", "dns")) and (if .probe.type == "http" then (.probe.url | type == "string") and ((.probe.jq // .probe.pattern) | type == "string") else true end)))' servers.json

      - name: Check README is up to date
        run: |
          ./scripts/generate-readme.sh
          git diff --exit-code README.md
