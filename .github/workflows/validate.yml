name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint scripts
        run: shellcheck scripts/*.sh

      - name: Build GameSpy helpers
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -o scripts/enctypex scripts/enctypex.c
          gcc -std=c11 -O2 -Wall -Wextra -Werror -o scripts/gamespy-enctype2 scripts/gamespy-enctype2.c scripts/third_party/gamespy-enctype2/enctype_shared.c

      - name: Install probe test dependencies
        run: sudo apt-get install -y gawk

      - name: Test probe scheduling and GameSpy failures
        run: python3 -m unittest discover -s tests -v

      - name: Validate servers.json
        run: jq -e '.games | type == "array" and all(.[]; (.name | type == "string") and all(.masters[]; (.host | type == "string") and (.official | type == "boolean" or . == null) and (.probe.type | IN("tcp", "gamespy", "getservers", "q2query", "qwquery", "idtech4", "zandronum", "odamex", "chocolatedoom", "cube2", "tribes1", "enctypex", "http", "dns")) and (if .probe.type == "http" then (.probe.url | type == "string") and ((.probe.jq // .probe.pattern) | type == "string") else true end) and (if .probe.push != null then (.probe.push | type == "boolean") and (.probe.type == "gamespy" and .probe.format == "enctype2") else true end) and (if .probe.format then (.probe.type == "gamespy" and .probe.format == "enctype2") else true end) and (if .probe.type == "enctypex" or .probe.type == "gamespy" then (.probe.gamename | type == "string") and (.probe.key | type == "string" and length == 6) else true end)) and all(.retired // [] | .[]; (.host | type == "string") and (.official | type == "boolean") and (.reason | type == "string") and ((.shutdown // .down_since) | type == "string" and test("^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$"))))' servers.json

      - name: Check README is up to date
        run: |
          ./scripts/generate-readme.sh
          git diff --exit-code README.md
