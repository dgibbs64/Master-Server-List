name: Check master servers

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - servers.json
      - site/**
      - .github/workflows/check-masters.yml

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: check-masters
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install netcat and gawk
        if: github.event_name != 'push'
        run: sudo apt-get install -y netcat-openbsd gawk

      - name: Check master servers
        if: github.event_name != 'push'
        run: ./scripts/check.sh

      - name: Open or close master-down issues
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git show HEAD:servers.json > "$RUNNER_TEMP/previous.json"
          ./scripts/alert.sh "$RUNNER_TEMP/previous.json" servers.json

      - name: Commit status changes
        if: github.event_name != 'push'
        run: |
          statuses() {
            jq -S 'del(.checked) | .games[].masters[] |= del(.last_seen, .servers)' "$1"
          }
          if diff -q <(git show HEAD:servers.json | statuses /dev/stdin) <(statuses servers.json) >/dev/null; then
            echo "No status changes"
            exit 0
          fi
          ./scripts/generate-readme.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update master server status"
          git pull --rebase
          git push

      - name: Record history
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="$RUNNER_TEMP/history"
          if git fetch -q origin history; then
            git worktree add -q -B history "$dir" FETCH_HEAD
          else
            git worktree add -q --orphan -b history "$dir"
          fi
          ./scripts/history.sh servers.json "$dir/history.json"
          cd "$dir"
          git add history.json
          git commit -qm "Record master status for $(date -u +%F)"
          git push -q origin history

      - name: Build site
        run: |
          mkdir -p _site
          cp site/* servers.json _site/
          if git fetch -q origin history; then
            git show FETCH_HEAD:history.json > _site/history.json
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
