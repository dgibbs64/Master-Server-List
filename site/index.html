<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Master Server List</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://ismygameserver.online/masters">
<script>
	(function () {
		var slug = location.hash.replace(/^#/, "").replace(/[^a-z0-9-]/g, "");
		location.replace("https://ismygameserver.online/masters" + (slug ? "/" + slug : ""));
	})();
</script>
<meta http-equiv="refresh" content="0; url=https://ismygameserver.online/masters">
<style>
:root {
	--bg: #f7f7f5;
	--text: #1c1c1a;
	--accent: #2456c7;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #141413;
		--text: #ecebe6;
		--accent: #7fa6ff;
		color-scheme: dark;
	}
}
body {
	margin: 0;
	padding: 48px 16px;
	background: var(--bg);
	color: var(--text);
	font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); }
</style>
</head>
